# API proxy to Lovable Cloud (Supabase) for api.бетон-тула.рф
# Punycode: api.xn----8sbbq5akg5adk.xn--p1ai
# Supabase project ref: yrupuuxauttnqowabosf

# WebSocket upgrade map (для Realtime). Если уже определён глобально — удалите этот блок.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.xn----8sbbq5akg5adk.xn--p1ai;

    access_log /var/log/nginx/tulbeton-api.access.log;
    error_log  /var/log/nginx/tulbeton-api.error.log;

    # Динамический резолв upstream (Supabase меняет IP)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 50m;

    # CORS (на случай прямых вызовов с других origin; same-site обычно не нужен)
    set $cors_origin "https://xn----8sbbq5akg5adk.xn--p1ai";

    location / {
        # Preflight CORS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Переменная нужна, чтобы nginx делал DNS-резолв в рантайме
        set $upstream "yrupuuxauttnqowabosf.supabase.co";

        proxy_pass https://$upstream;
        proxy_http_version 1.1;

        # Host должен быть Supabase-овый, иначе их роутинг не сработает
        proxy_set_header Host              $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name        $upstream;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Проброс auth-заголовков
        proxy_pass_request_headers on;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header apikey            $http_apikey;
        proxy_set_header X-Client-Info     $http_x_client_info;

        # WebSocket для Realtime
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Таймауты (Edge Functions, стримы)
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;

        # CORS на ответы
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"        always;
        add_header Access-Control-Expose-Headers    "content-range, x-total-count" always;
    }
}
