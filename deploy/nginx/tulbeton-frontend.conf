# Frontend nginx config for бетон-тула.рф (punycode: xn--h1aagca8acci.xn--p1ai)
# Place at /etc/nginx/sites-available/tulbeton-frontend.conf
# Then: sudo ln -s ../sites-available/tulbeton-frontend.conf /etc/nginx/sites-enabled/
# After certbot adds 443/SSL, this file will gain listen 443 ssl + ssl_certificate lines automatically.

server {
    listen 80;
    listen [::]:80;
    server_name xn--h1aagca8acci.xn--p1ai www.xn--h1aagca8acci.xn--p1ai;

    root /var/www/tulbeton/current;
    index index.html;

    # Logs
    access_log /var/log/nginx/tulbeton-frontend.access.log;
    error_log  /var/log/nginx/tulbeton-frontend.error.log;

    # Gzip (brotli — если установлен модуль ngx_brotli, добавьте brotli on; brotli_types ...;)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.xn--h1aagca8acci.xn--p1ai https://*.supabase.co wss://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;

    # Хешированные ассеты Vite — кешируем агрессивно
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Шрифты, картинки в корне build
    location ~* \.(?:woff2?|ttf|otf|eot|svg|jpg|jpeg|png|gif|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # index.html — никогда не кешировать
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Скрыть служебные
    location ~ /\.(?!well-known) {
        deny all;
    }
}
